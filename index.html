<style>

  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;

}

  --accent:#CBA66B; --accent-fg:#17181A; --accent-soft:#33291B;
  --ok:#6CC08D; --ok-soft:#1C3326; --no:#E07B72; --no-soft:#3A1F1D; --warn:#E0B25A; --warn-soft:#3A2E17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121315; --surface:#1B1C1F; --surface-2:#25262A; --fg:#ECECEA; --muted:#9A9BA0; --line:#2F3035;
  --accent:#CBA66B; --accent-fg:#17181A; --accent-soft:#33291B;
  --ok:#6CC08D; --ok-soft:#1C3326; --no:#E07B72; --no-soft:#3A1F1D; --warn:#E0B25A; --warn-soft:#3A2E17; color-scheme:dark}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}

@media (prefers-reduced-motion:no-preference){ .toast{animation:pop .2s ease-out} @keyframes pop{from{opacity:0;transform:translate(-50%,8px)}} }

.rs{display:flex;flex-direction:column;gap:14px}
.rs-sec{display:grid;grid-template-columns:92px 1fr;gap:4px 12px;padding-top:12px;border-top:1px solid var(--line)}

textarea.paste{min-height:260px;font-family:var(--font-mono);font-size:.8rem;line-height:1.5}
.edit-line{display:grid;grid-template-columns:1.3fr 1fr 64px;gap:8px;align-items:end}

@media (max-width:420px){.edit-line{grid-template-columns:1fr 1fr}.edit-line .hrs{grid-column:1/-1}}
.rs-sec .v b{font-weight:700}
.bell{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:10px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.bell svg{width:20px;height:20px}
.bell .dot{position:absolute;top:-5px;right:-5px;background:var(--no);color:#fff;border-radius:999px;font-size:.68rem;font-weight:800;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.chat{display:flex;flex-direction:column;gap:8px;min-height:200px;max-height:48vh;overflow:auto;background:var(--bg);border-radius:10px;padding:10px}

.msg.mine{align-self:flex-end;background:var(--accent-soft);border-color:transparent;border-radius:12px 12px 4px 12px}
.msg img{border-radius:8px;max-width:220px}
.who-l{font-size:.7rem;font-weight:700;color:var(--muted)}
.sysmsg{align-self:center;font-size:.74rem;color:var(--muted);text-align:center;max-width:90%}
.pickup{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:.9rem}

<div id="app"></div>

<script>
(function(){
const KEY='gclass-crew-demo-v4';
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDay=s=>{const d=new Date(s+'T00:00');return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]};
const fmtTime=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const ddmmyy=s=>{if(!s)return'';const [y,m,d]=s.split('-');return d+'/'+m+'/'+y.slice(2)};

/* ---- 24h <-> display ---- */
const h12=t=>{if(!/^\d\d:\d\d$/.test(t||''))return t||'';let [h,m]=t.split(':').map(Number);const ap=h>=12?'pm':'am';h=h%12||12;return h+':'+pad(m)+ap};
const addHours=(t,hrs)=>{if(!/^\d\d:\d\d$/.test(t||'')||!hrs)return'';const [h,m]=t.split(':').map(Number);const mins=h*60+m+Math.round(hrs*60);return pad(Math.floor(mins/60)%24)+':'+pad(mins%60)};

/* ---------- Run sheet parser (WhatsApp text -> job) ---------- */
const CAR_KEYS=[['c1',/cullinan/i],['c2',/limo|chrysler/i],['c3',/urus|lambo/i],['c4',/ghost/i],['c5',/g\s*-?\s*wagon|g\s*class|g63/i]];
function matchCar(txt){for(const [id,re] of CAR_KEYS) if(re.test(txt)&&S.cars.some(c=>c.id===id)) return id;
  const t=txt.toLowerCase();const c=S.cars.find(c=>t.includes(c.name.toLowerCase())||c.name.toLowerCase().includes(t.trim()));return c?c.id:''}
function matchWorker(txt){const t=txt.trim().toLowerCase();if(!t)return'';
  let w=S.workers.find(w=>w.name.toLowerCase()===t)||S.workers.find(w=>w.name.toLowerCase().startsWith(t))||S.workers.find(w=>t.startsWith(w.name.toLowerCase().split(' ')[0]));return w?w.id:''}
function parseTime(raw,ctx,warns){
  if(!raw)return {text:'',t24:''};
  const m=raw.match(/(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm)?/i);
  if(!m) return {text:raw.trim(),t24:''};
  let h=+m[1],mi=+(m[2]||0),ap=(m[3]||'').toLowerCase();
  if(ap==='am'&&h<9&&/ceremony|reception|photos|getaway/i.test(ctx)){warns.push(`${ctx} time says ${raw.trim()}. I've read it as ${h}:${pad(mi)}pm.`);ap='pm'}
  if(!ap) ap=(h>=1&&h<=9)?'pm':'am';
  let H=h%12+(ap==='pm'?12:0);
  const rest=raw.replace(m[0],'').trim();
  const t24=pad(H)+':'+pad(mi);
  return {text:h12(t24)+(rest?' '+rest:''),t24};
}
function parseRunSheet(text){
  const warns=[];const job={id:uid(),client:'',date:'',groom:{},bride:{},ceremony:{},photos:{},reception:{},getaway:{},note:'',lines:[]};
  let sec=null;
  for(let raw of text.split(/\r?\n/)){
    const line=raw.replace(/\s+/g,' ').trim(); if(!line)continue;
    let m;
    if((m=line.match(/^(\d+)\s*x\s+(.+?)\s+-\s+(.+)$/i))){
      let left=m[2],right=m[3],hours=null,task='',note='';
      const hm=left.match(/@\s*(\d+(?:\.\d+)?)\s*h(?:ou)?rs?/i); if(hm){hours=+hm[1];left=left.replace(hm[0],' ')}
      const tm=left.match(/\(([^)]*)\)/g)||[]; const parens=tm.map(x=>x.slice(1,-1).trim()); tm.forEach(x=>left=left.replace(x,' '));
      const dot=left.split('·'); left=dot[0]; const after=dot.slice(1).join(' ').trim();
      task=[after,...parens].filter(Boolean).join(' · ');
      const rn=right.match(/^([^(]+?)\s*(?:\((.*)\))?$/); const who=rn?rn[1]:right; note=rn&&rn[2]?rn[2]:'';
      const carName=left.replace(/\s+/g,' ').trim();
      const line={carText:carName,carId:matchCar(carName),hours,task,driverText:who.trim(),wid:matchWorker(who),note};
      if(!line.carId) warns.push(`I don't recognise the car "${carName}". Pick it below.`);
      if(!line.wid) warns.push(`I don't recognise the driver "${who.trim()}". Pick them below.`);
      job.lines.push(line); sec=null; continue;
    }
    if((m=line.match(/^client\s*:\s*(.*)$/i))){job.client=m[1];continue}
    if((m=line.match(/^date\s*:\s*(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/i))){let y=+m[3];if(y<100)y+=2000;job.date=y+'-'+pad(+m[2])+'-'+pad(+m[1]);continue}
    if((m=line.match(/^(groom|bride)\s*:\s*(.*)$/i))){sec=m[1].toLowerCase();job[sec].name=m[2];continue}
    if((m=line.match(/^(ceremony|photos|getaway)\s*:?\s*$/i))){sec=m[1].toLowerCase();continue}
    if((m=line.match(/^reception\s*:?\s*(.*)$/i))){sec='reception';job.reception.venue=m[1];continue}
    if((m=line.match(/^note\s*:\s*(.*)$/i))){job.note=(job.note?job.note+' ':'')+m[1];continue}
    if(sec&&(m=line.match(/^([a-z ]+?)\s*:\s*(.*)$/i))){
      const k=m[1].toLowerCase(),v=m[2].trim(),o=job[sec];
      if(/time/.test(k)){const p=parseTime(v,sec[0].toUpperCase()+sec.slice(1),warns);o.time=p.text;o.t24=p.t24}
      else if(/address/.test(k))o.address=v; else if(/location|venue/.test(k))o.location=v;
      else if(/cars?/.test(k))o.cars=v; else if(/destination/.test(k))o.destination=v; else o[k]=v;
      continue;
    }
    job.note=(job.note?job.note+' ':'')+line;
  }
  if(!job.date) warns.push('No date found. Add a line like "Date : 29/11/26".');
  if(!job.client) warns.push('No client name found.');
  if(!job.lines.length) warns.push('No cars found. Car lines look like "1x RR Ghost @2 Hours - Adem".');
  const start=[job.groom.t24,job.bride.t24].filter(Boolean).sort()[0]||'';
  job.lines.forEach(l=>{l.start=l.start||start});
  return {job,warns};
}
function jobWarnings(job){
  const w=[];
  job.lines.forEach(l=>{
    if(l.wid&&S.avail[l.wid+'|'+job.date]==='no') w.push(`${W(l.wid).name} marked ${fmtDay(job.date)} as Off.`);
    const clash=S.jobs.find(j=>j.id!==job.id&&j.date===job.date&&j.lines.some(x=>x.carId&&x.carId===l.carId));
    if(clash) w.push(`${C(l.carId).name} is already on ${clash.client}'s job that day.`);
  });
  const seen={};job.lines.forEach(l=>{if(l.wid){if(seen[l.wid])w.push(`${W(l.wid).name} is on two cars in this job.`);seen[l.wid]=1}});
  return w;
}

  j.lines.forEach(l=>L.push(`1x ${C(l.carId).name||l.carText}${l.hours?` @${l.hours} Hours`:''}${l.task?` · (${l.task})`:''} - ${l.wid?W(l.wid).name:l.driverText}${l.note?` (${l.note})`:''}`));
  L.push('',`Client: ${j.client}`,`Date : ${ddmmyy(j.date)}`);
  [['groom','Groom'],['bride','Bride']].forEach(([k,n])=>{const o=j[k];if(o.name||o.address){L.push('',`${n}: ${o.name||''}`,`Address: ${o.address||''}`,`Time: ${o.time||''}`,`Cars: ${o.cars||''}`)}});
  if(j.ceremony.time||j.ceremony.location)L.push('','CEREMONY',`Time: ${j.ceremony.time||''}`,`Location: ${j.ceremony.location||''}`,`Address: ${j.ceremony.address||''}`);
  if(j.photos.time||j.photos.address)L.push('','PHOTOS',`Time: ${j.photos.time||''}`,`Address: ${j.photos.address||''}`);
  if(j.note)L.push('',`NOTE: ${j.note}`);

}

function carTokenMatch(tok,carId){const c=C(carId),T=tok.trim().toLowerCase();if(!T||!carId)return false;
  if(T==='rr'||T==='rolls')return /^rr\b|rolls/i.test(c.name);
  if(T==='g'||T==='g wagon'||T==='gwagon')return /g\s*-?\s*wagon/i.test(c.name);
  return T.length>2&&(matchCar(tok)===carId||c.name.toLowerCase().includes(T))}
function pickupFor(job,l){const t=(l.task||'').toLowerCase();
  if(/groom/.test(t))return ['Groom',job.groom]; if(/bride/.test(t))return ['Bride',job.bride];
  for(const k of ['bride','groom']){const toks=(job[k].cars||'').split(/&|,|\+|\band\b/i);if(toks.some(x=>carTokenMatch(x,l.carId)))return [k==='groom'?'Groom':'Bride',job[k]]}
  return null}
function members(job){return [...new Set([...S.workers.filter(w=>w.role==='owner').map(w=>w.id),...job.lines.map(l=>l.wid).filter(Boolean)])]}
function notify(job,kind){
  const owner=S.workers.find(w=>w.role==='owner');const told=[];
  job.lines.forEach(l=>{if(!l.wid)return;const p=pickupFor(job,l);
    const txt=`${kind==='new'?'New job':'Job updated'} · ${fmtDay(job.date)} · ${C(l.carId).name||l.carText}${l.hours?' ('+l.hours+' hrs)':''}. `+(p?`${p[0]} pickup ${p[1].time||'time TBC'} at ${p[1].address||'address TBC'}.`:`Start ${h12(l.start)||'time TBC'}.`)+(l.note?' '+l.note:'');
    S.notes.push({id:uid(),wid:l.wid,jobId:job.id,text:txt,at:Date.now(),read:false});told.push(W(l.wid).name)});
  (S.chats[job.id]=S.chats[job.id]||[]).push({sys:true,at:Date.now(),text:`${owner?owner.name:'Owner'} ${kind==='new'?'created':'updated'} the run sheet and notified ${told.join(', ')||'nobody yet'}.`});
  return told;
}

/* ---------- Sign-out / sign-in sheet ---------- */
const OUT_CHECKS=['Exterior clean','Interior clean','Ribbons on board','Water & umbrellas on board','No new damage'];
const IN_CHECKS=['No new damage','Interior cleared of rubbish','Keys returned','Fuel receipt uploaded (if refuelled)'];
function lastOdo(carId){let m=0;S.trips.filter(t=>t.carId===carId).forEach(t=>{m=Math.max(m,t.outOdo||0,t.inOdo||0)});return m}
function startDraft(mode,carId){
  const trip=myOpenTrip();
  draft={mode,carId:carId||trip?.carId,odo:mode==='in'?'':String(lastOdo(carId)||''),fuel:'',checks:[],notes:'',photos:[]};
  sheet='trip'; render();
}
function tripSheet(){
  const d=draft, c=C(d.carId), out=d.mode==='out', checks=out?OUT_CHECKS:IN_CHECKS;
  const ok=d.odo&&d.fuel&&d.photos.length>=2;
  return `<div class="sheet" id="sheetbg"><div class="panel" role="dialog" aria-modal="true" aria-label="${out?'Sign car out':'Return car'}">
    <div class="status">${sw(d.carId)}<div><span class="eyebrow">${out?'Signing out':'Returning'}</span><h2>${esc(c.name)}</h2></div><div class="spacer"></div><button class="btn ghost" data-act="close" aria-label="Close">✕</button></div>
    <div class="grid2"><label class="f">Odometer (km)<input id="odo" type="number" inputmode="numeric" value="${esc(d.odo)}"></label>
    <div class="f" style="display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.88rem">Fuel<div class="fuel">${['1/4','1/2','3/4','Full'].map(f=>`<button type="button" data-fuel="${f}" aria-pressed="${d.fuel===f}">${f}</button>`).join('')}</div></div></div>
    <div class="f" style="display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.88rem">Photos <span class="muted" style="font-weight:500">At least 2: front and back. Add any marks or damage.</span>
      <div class="photos">${d.photos.map((p,i)=>`<img src="${p}" alt="Photo ${i+1}">`).join('')}<label class="addphoto"><input id="ph" type="file" accept="image/*" capture="environment" multiple>＋<br>Add photo</label></div></div>
    <div class="checks">${checks.map(x=>`<label><input type="checkbox" data-chk="${esc(x)}" ${d.checks.includes(x)?'checked':''}>${esc(x)}</label>`).join('')}</div>
    <label class="f">Notes<textarea id="notes" placeholder="${out?'Anything already wrong with the car?':'Anything Ahmed should know? Damage, warning lights, needs a wash…'}">${esc(d.notes)}</textarea></label>
    <button class="btn primary block" data-act="confirm" ${ok?'':'disabled'}>${out?'Sign out car':'Sign car back in'}</button>
    ${ok?'':'<p class="muted" style="margin:0;font-size:.8rem;text-align:center">Add odometer, fuel level and 2 photos to continue.</p>'}
  </div></div>`;
}
function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const m=520,s=Math.min(1,m/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=img.width*s;cv.height=img.height*s;cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',.6))};img.onerror=()=>res(null);img.src=r.result};r.readAsDataURL(file)})}
function confirmTrip(){
  const d=draft,now=Date.now();
  if(d.mode==='out'){
    const job=myShifts().find(s=>s.date===iso(today())&&s.carId===d.carId);
    S.trips.push({id:uid(),carId:d.carId,wid:me.id,date:iso(today()),jobId:job?.job.id||null,outAt:now,outOdo:+d.odo,outFuel:d.fuel,outChecks:d.checks,outNotes:d.notes,outPhotos:d.photos});
    toast(C(d.carId).name+' signed out to you');
  } else {
    const t=myOpenTrip(); if(+d.odo<t.outOdo){toast('Odometer is lower than at sign-out ('+t.outOdo+' km). Check the reading.');return}
    Object.assign(t,{inAt:now,inOdo:+d.odo,inFuel:d.fuel,inChecks:d.checks,inNotes:d.notes,inPhotos:d.photos});
    toast('Car returned. '+(t.inOdo-t.outOdo)+' km driven.');
  }
  save(); draft=null; sheet=null; render();
}

/* ---------- Binding ---------- */
function bind(){
  const $=s=>document.getElementById(s);
  $('logout').onclick=()=>{me=null;sheet=null;render()};
  $('bell').onclick=()=>{sheet='inbox';render()};
  document.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>{chatJob=b.dataset.chat;S.seen[me.id+'|'+chatJob]=(S.chats[chatJob]||[]).length;S.notes.forEach(n=>{if(n.wid===me.id&&n.jobId===chatJob)n.read=true});save();sheet='chat';render()});
  document.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>{const n=S.notes.find(x=>x.id===b.dataset.note);n.read=true;save();viewJob=n.jobId;sheet=J(n.jobId)?'job':null;render()});
  if(sheet==='chat'){const log=$('chatlog');if(log)log.scrollTop=log.scrollHeight;
    $('chatform').onsubmit=e=>{e.preventDefault();const v=$('chatin').value.trim();if(v)sendChat(v);setTimeout(()=>document.getElementById('chatin')?.focus(),0)};
    $('chatph').onchange=async e=>{const f=e.target.files[0];if(f){const u=await shrink(f);if(u)sendChat('',u)}}}
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();scrollTo(0,0)});
  document.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>{viewJob=b.dataset.job;delArm=null;S.notes.forEach(n=>{if(n.wid===me.id&&n.jobId===viewJob)n.read=true});save();sheet='job';render()});
  document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{const k=me.id+'|'+b.dataset.day;if(myShifts().some(s=>s.date===b.dataset.day))return toast('You\'re booked that day. Message Ahmed to swap.');
    const v=S.avail[k];if(!v)S.avail[k]='yes';else if(v==='yes')S.avail[k]='no';else delete S.avail[k];save();render()});
  document.querySelectorAll('[data-cell]').forEach(b=>b.onclick=()=>{const [wid,date]=b.dataset.cell.split('|');const v=S.avail[wid+'|'+date];toast(`${W(wid).name}: ${v==='yes'?'free':v==='no'?'off':'hasn\'t marked'} ${fmtDay(date)}`)});
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{const a=b.dataset.act;
    if(a==='pickcar')startDraft('out',b.dataset.car);
    if(a==='signin')startDraft('in');
    if(a==='close'){sheet=null;draft=null;paste=null;render()}
    if(a==='confirm')confirmTrip();
    if(a==='newjob'){paste={text:TEMPLATE,parsed:null};sheet='paste';render()}
    if(a==='editjob'){const j=J(viewJob);paste={text:runSheetText(j),editId:j.id,parsed:null};sheet='paste';render()}
    if(a==='parse'){paste.text=$('pastein').value;paste.parsed=parseRunSheet(paste.text);if(paste.editId)paste.parsed.job.id=paste.editId;render();setTimeout(()=>document.querySelector('[data-act="savejob"]')?.scrollIntoView({block:'nearest'}),0)}
    if(a==='savejob')saveJob();
    if(a==='deljob'){if(delArm===viewJob){S.jobs=S.jobs.filter(j=>j.id!==viewJob);save();sheet=null;delArm=null;render();toast('Job deleted')}else{delArm=viewJob;render()}}
    if(a==='copyrs'){const txt=runSheetText(J(viewJob));try{await navigator.clipboard.writeText(txt);toast('Copied. Paste it into WhatsApp.')}catch(e){toast('Copy blocked here. Open Edit and copy the text.')}}
    if(a==='allfree'){for(let i=0;i<14;i++){const k=me.id+'|'+iso(addDays(today(),i));if(!S.avail[k])S.avail[k]='yes'}save();render();toast('Marked as Free')}
    if(a==='reset'){S=seed();save();me=S.workers[0];render();toast('Demo data reset')}
  });
  if(sheet==='paste'&&paste.parsed){
    const L=paste.parsed.job.lines;
    document.querySelectorAll('[data-lc]').forEach(s=>s.onchange=()=>{L[+s.dataset.lc].carId=s.value;paste.text=$('pastein').value;refreshWarn()});
    document.querySelectorAll('[data-lw]').forEach(s=>s.onchange=()=>{L[+s.dataset.lw].wid=s.value;paste.text=$('pastein').value;refreshWarn()});
    document.querySelectorAll('[data-lh]').forEach(s=>s.oninput=()=>{L[+s.dataset.lh].hours=s.value?+s.value:null});
  }
  if(sheet==='trip'){
    $('odo').oninput=e=>{draft.odo=e.target.value;const btn=document.querySelector('[data-act="confirm"]');if(btn)btn.disabled=!(draft.odo&&draft.fuel&&draft.photos.length>=2)};
    $('notes').oninput=e=>draft.notes=e.target.value;
    document.querySelectorAll('[data-fuel]').forEach(b=>b.onclick=()=>{draft.fuel=b.dataset.fuel;render()});
    document.querySelectorAll('[data-chk]').forEach(c=>c.onchange=()=>{const x=c.dataset.chk;draft.checks=c.checked?[...draft.checks,x]:draft.checks.filter(y=>y!==x)});
    $('ph').onchange=async e=>{for(const f of e.target.files){const u=await shrink(f);if(u)draft.photos.push(u)}render()};
  }
  const cf=$('carform');if(cf)cf.onsubmit=e=>{e.preventDefault();const n=$('cname').value.trim();S.cars.push({id:uid(),name:n,code:initials(n),rego:$('crego').value.trim().toUpperCase()});save();render();toast('Car added')};
  const sf=$('staffform');if(sf)sf.onsubmit=e=>{e.preventDefault();S.workers.push({id:uid(),name:$('wname').value.trim(),pin:$('wpin').value,role:'driver'});save();render();toast('Chauffeur added')};
}
/* re-check warnings after fixing a car/driver pick, keeping the parser's own notes about unrecognised names only if still unresolved */
function refreshWarn(){const p=paste.parsed;p.warns=p.warns.filter(w=>{const m=w.match(/"(.+)"/);if(!m)return true;return p.job.lines.some(l=>(/car/.test(w)?!l.carId&&l.carText===m[1]:!l.wid&&l.driverText===m[1]))});
  const st=document.querySelector('.sheet .panel').scrollTop;render();document.querySelector('.sheet .panel').scrollTop=st}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.workers) S=seed();
S.notes=S.notes||[];S.chats=S.chats||{};S.seen=S.seen||{};
render();
})();
</script>
</html>
