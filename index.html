<style>
/* Layout: single phone-width column app, sticky top bar, bottom tab bar; owner view widens to a roster grid */
:root{
  /* G Class Hire, black and white: true black, greys, white as the accent. Status colours keep their meaning. */
  --brand:#1A1A1A; --brand-2:#000000; --brand-fg:#FFFFFF; --brand-muted:#9A9A9A;
  --bg:#000000; --surface:#111111; --surface-2:#1C1C1C; --fg:#FFFFFF; --muted:#8C8C8C; --line:#2A2A2A;
  --accent:#FFFFFF; --accent-fg:#000000; --accent-soft:#1F1F1F; --gold-light:#FFFFFF;
  --ok:#9BD3AE; --ok-soft:#14221A; --no:#EB8C82; --no-soft:#2A1614; --warn:#E8C27A; --warn-soft:#2A2314;
  --font-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.25rem} h3{font-size:1rem}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.wide{max-width:1100px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.brand{font-family:var(--font-display);font-weight:800;font-size:1.05rem;letter-spacing:.02em}
.brand small{display:block;font-family:var(--font-body);font-weight:500;font-size:.75rem;color:var(--muted);letter-spacing:0}
.spacer{flex:1}
main{padding-block:18px 110px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{background:var(--no);border-color:var(--no);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding-inline:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.88rem}
input[type=text],input[type=number],input[type=password],input[type=time],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-height:44px}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.no{background:var(--no-soft);color:var(--no)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.n{background:var(--surface-2);color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:.85rem}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:flex}
.tabs button{flex:1;background:none;border:0;padding:10px 4px 12px;font-size:.76rem;font-weight:700;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="true"]{color:var(--accent)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line);border-radius:10px;padding:8px 2px;text-align:center;cursor:pointer;background:var(--surface);display:flex;flex-direction:column;gap:2px;min-height:68px;justify-content:center}
.day .dw{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.day .dn{font-family:var(--font-display);font-size:1.15rem;font-weight:700}
.day .ds{font-size:.66rem;font-weight:700}
.day.yes{background:var(--ok-soft);border-color:var(--ok)} .day.yes .ds{color:var(--ok)}
.day.no{background:var(--no-soft);border-color:var(--no)} .day.no .ds{color:var(--no)}
.day.shift{box-shadow:inset 0 0 0 2px var(--accent)}
.day.locked{cursor:default}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cars{display:grid;gap:10px}
.car{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.car[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.car:disabled{cursor:not-allowed;opacity:.55}
.swatch{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);flex:none}
.car .meta{flex:1;min-width:0}
.car .meta b{display:block;font-family:var(--font-display)}
.fuel{display:flex;gap:6px}
.fuel button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 0;font-weight:700;font-size:.82rem;cursor:pointer}
.fuel button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line);max-width:100%}
.addphoto{aspect-ratio:1;border:1.5px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:.72rem;font-weight:700;color:var(--muted);cursor:pointer;text-align:center;padding:4px}
.addphoto input{display:none}
.checks{display:grid;gap:8px}
.checks label{display:flex;gap:10px;align-items:center;font-weight:500}
.checks input{width:20px;height:20px;accent-color:var(--accent)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:0}
.li .body{flex:1;min-width:0}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.roster{border-collapse:separate;border-spacing:0;font-size:.8rem;min-width:100%}
.roster th,.roster td{padding:6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.roster th:first-child,.roster td:first-child{position:sticky;left:0;background:var(--surface);text-align:left;z-index:1;font-weight:700}
.roster thead th{font-size:.7rem;color:var(--muted);font-weight:700}
.roster thead th b{display:block;color:var(--fg);font-family:var(--font-display);font-size:.95rem}
.cell{width:40px;height:34px;border-radius:7px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.72rem;cursor:pointer;background:var(--bg);margin:auto}
.cell.yes{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.cell.no{background:var(--no-soft);color:var(--no);border-color:transparent}
.cell.sh{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{font-family:var(--font-display);font-size:1.5rem;display:block;font-variant-numeric:tabular-nums}
.login{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding-block:40px}
.login .hero{display:flex;flex-direction:column;gap:6px;margin-bottom:22px}
.login .hero h1{font-size:2rem;font-weight:800}
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.who button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.who button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-family:var(--font-display);flex:none}
.pin{display:flex;gap:8px}
.pin input{text-align:center;font-family:var(--font-mono);font-size:1.3rem;letter-spacing:.4em}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:20;max-width:calc(100% - 32px);text-align:center}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--surface);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:auto}
.banner{background:var(--accent-soft);color:var(--fg);border-radius:10px;padding:10px 12px;font-size:.82rem}
.status{display:flex;gap:12px;align-items:center}
.big{font-family:var(--font-display);font-size:1.4rem;font-weight:800}
@media (min-width:900px){ .ownergrid{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:start} }
@media (prefers-reduced-motion:no-preference){ .toast{animation:pop .2s ease-out} @keyframes pop{from{opacity:0;transform:translate(-50%,8px)}} }
.swatch{display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--fg);font-family:var(--font-display);font-weight:800;font-size:.78rem;letter-spacing:.02em}
.rs{display:flex;flex-direction:column;gap:14px}
.rs-sec{display:grid;grid-template-columns:92px 1fr;gap:4px 12px;padding-top:12px;border-top:1px solid var(--line)}
.rs-sec:first-child{border-top:0;padding-top:0}
.rs-sec .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;padding-top:2px}
.rs-sec .v{min-width:0;overflow-wrap:anywhere}
.rs-sec .v .t{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:500}
.lineup{display:flex;flex-direction:column;gap:8px}
.lu{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)}
.lu.me{border-color:var(--accent);background:var(--accent-soft)}
.lu .body{flex:1;min-width:0}
.lu .swatch{width:34px;height:34px;border-radius:8px}
.warns{display:flex;flex-direction:column;gap:6px}
.warn-row{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:.84rem;font-weight:600}
textarea.paste{min-height:260px;font-family:var(--font-mono);font-size:.8rem;line-height:1.5}
.edit-line{display:grid;grid-template-columns:1.3fr 1fr 64px;gap:8px;align-items:end}
.edit-line .lbl{grid-column:1/-1;font-size:.8rem;font-weight:700}
@media (max-width:420px){.edit-line{grid-template-columns:1fr 1fr}.edit-line .hrs{grid-column:1/-1}}
.rs-sec .v b{font-weight:700}
.bell{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:10px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.bell svg{width:20px;height:20px}
.bell .dot{position:absolute;top:-5px;right:-5px;background:var(--no);color:#fff;border-radius:999px;font-size:.68rem;font-weight:800;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.chat{display:flex;flex-direction:column;gap:8px;min-height:200px;max-height:48vh;overflow:auto;background:var(--bg);border-radius:10px;padding:10px}
.msg{max-width:82%;background:var(--surface);border:1px solid var(--line);border-radius:12px 12px 12px 4px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;overflow-wrap:anywhere}
.msg.mine{align-self:flex-end;background:var(--accent-soft);border-color:transparent;border-radius:12px 12px 4px 12px}
.msg img{border-radius:8px;max-width:220px}
.who-l{font-size:.7rem;font-weight:700;color:var(--muted)}
.sysmsg{align-self:center;font-size:.74rem;color:var(--muted);text-align:center;max-width:90%}
.pickup{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:.9rem}

/* masculine pass, per brand kit: Archivo headings, tracked Manrope labels, sharp corners, gold accents */
h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:-.01em;text-transform:none}
h2{font-size:1.35rem}
.login .hero h1{text-transform:uppercase}
.eyebrow{font-family:var(--font-body);font-weight:800;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}

<script>
(function(){
const pl=(n,w)=>n+' '+w+(n===1?'':'s');
const KEY='gclass-crew-demo-v6';
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDay=s=>{const d=new Date(s+'T00:00');return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]};
const fmtTime=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);

/* ---- 24h <-> display ---- */
const h12=t=>{if(!/^\d\d:\d\d$/.test(t||''))return t||'';let [h,m]=t.split(':').map(Number);const ap=h>=12?'pm':'am';h=h%12||12;return h+':'+pad(m)+ap};
const addHours=(t,hrs)=>{if(!/^\d\d:\d\d$/.test(t||'')||!hrs)return'';const [h,m]=t.split(':').map(Number);const mins=h*60+m+Math.round(hrs*60);return pad(Math.floor(mins/60)%24)+':'+pad(mins%60)};

/* ---------- Run sheet parser (WhatsApp text -> job) ---------- */
// Keyword -> which cars in the fleet it can mean. Several cars can share a keyword (e.g. 2 Ghosts, 2 Maybachs).
const CAR_KEYS=[/cullinan/i,/ghost/i,/dawn/i,/phantom/i,/chrysler|^limo/i,/hummer/i,/urus/i,/revuelto/i,/aventador/i,/ferrari|812/i,/mclaren|720/i,/porsche|gt3/i,/maybach/i,/g\s*-?\s*wagon|g\s*class|g63/i,/v[\s-]*class/i,/austin|princess/i,/220\s*se/i,/eleanor|shelby|mustang/i,/charger|dodge/i,/harley/i];
function carCandidates(txt){
  const t=(txt||'').trim();if(!t)return[];const low=t.toLowerCase();
  // exact-ish name first ("Chrysler Limo S2"), then by model keyword ("Ghosts" -> both Ghosts)
  if(low.length>=4){const ex=S.cars.filter(c=>c.name.toLowerCase()===low||c.name.toLowerCase().startsWith(low+' ')||low.startsWith(c.name.toLowerCase()));if(ex.length)return ex.map(c=>c.id)}
  for(const re of CAR_KEYS) if(re.test(t)){const cs=S.cars.filter(c=>re.test(c.name));if(cs.length)return cs.map(c=>c.id)}
  if(low.length<3)return[];
  return S.cars.filter(c=>low.includes(c.name.toLowerCase())||c.name.toLowerCase().includes(low)).map(c=>c.id)}
function matchCar(txt){return carCandidates(txt)[0]||''}
function matchWorker(txt){const t=txt.trim().toLowerCase();if(!t)return'';
  const w=S.workers.find(w=>w.name.toLowerCase()===t)||S.workers.find(w=>w.name.toLowerCase().startsWith(t+' '))||S.workers.find(w=>w.name.toLowerCase().startsWith(t))||(t.length>2&&S.workers.find(w=>t.startsWith(w.name.toLowerCase().split(' ')[0]+' ')));return w?w.id:''}
function parseTime(raw,ctx,warns){
  if(!raw)return {text:'',t24:''};
  const m=raw.match(/(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm)?/i);
  if(!m) return {text:raw.trim(),t24:''};
  let h=+m[1],mi=+(m[2]||0),ap=(m[3]||'').toLowerCase();
  if(ap==='am'&&h<9&&/ceremony|reception|photos|getaway/i.test(ctx)){warns.push(`${ctx} time says ${raw.trim()}. I've read it as ${h}:${pad(mi)}pm.`);ap='pm'}
  if(!ap) ap=(h>=1&&h<=9)?'pm':'am';
  const H=h%12+(ap==='pm'?12:0);
  const rest=raw.replace(m[0],'').trim();
  const t24=pad(H)+':'+pad(mi);
  return {text:h12(t24)+(rest?' '+rest:''),t24};
}
const toMin=t=>/^\d\d:\d\d$/.test(t||'')?(+t.slice(0,2))*60+(+t.slice(3)):null;
// When a car line is busy: from its start for its hours (5 hrs if not given; a getaway-only car from 30 min before the getaway).
function lineWindow(job,l){const s=toMin(l.start);if(s==null)return null;return [s,s+Math.round((l.hours||5)*60)]}
const overlaps=(a,b)=>a&&b&&a[0]<b[1]&&b[0]<a[1];
function busyLines(date,exceptJobId){return S.jobs.filter(j=>j.date===date&&j.id!==exceptJobId).flatMap(j=>j.lines.map(l=>({l,j,win:lineWindow(j,l)})))}
function parseRunSheet(text){
  const warns=[];const job={id:uid(),client:'',date:'',groom:{},bride:{},ceremony:{},photos:{},reception:{},getaway:{},note:'',lines:[]};
  let sec=null;const raws=[];
  for(const raw of text.split(/\r?\n/)){
    const line=raw.replace(/\s+/g,' ').trim(); if(!line)continue;
    let m;
    if((m=line.match(/^(\d+)\s*x\s+(.+?)\s+-\s+(.+)$/i))){
      let left=m[2],right=m[3],hours=null;
      const hm=left.match(/@\s*(\d+(?:\.\d+)?)\s*h(?:ou)?rs?/i); if(hm){hours=+hm[1];left=left.replace(hm[0],' ')}
      const tm=left.match(/\(([^)]*)\)/g)||[]; const parens=tm.map(x=>x.slice(1,-1).trim()); tm.forEach(x=>left=left.replace(x,' '));
      const dot=left.split('·'); left=dot[0]; const after=dot.slice(1).join(' ').trim();
      // "Getaway - Paolo": everything before the last " - " is the task, the last part is the driver(s)
      const parts=right.split(/\s+-\s+/); let who=parts.pop(); const extra=parts.join(' · ');
      const rn=who.match(/^([^(]+?)\s*(?:\((.*)\))?$/); const note=rn&&rn[2]?rn[2]:''; who=(rn?rn[1]:who).trim();
      const task=[after,extra,...parens].filter(Boolean).join(' · ');
      const drivers=who.split(/\s*&\s*|\s*,\s*|\s+and\s+/i).filter(Boolean);
      const n=Math.max(+m[1]||1,drivers.length);
      const carText=left.replace(/\s+/g,' ').trim().replace(/\b(ghost|maybach|wagon|limo|dawn|phantom|urus)s\b/ig,'$1');
      for(let i=0;i<n;i++) raws.push({carText,hours,task,note,driverText:drivers[i]||drivers[0]||''});
      sec=null; continue;
    }
    if((m=line.match(/^client\s*:\s*(.*)$/i))){job.client=m[1];continue}
    if((m=line.match(/^date\s*:\s*(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/i))){let y=+m[3];if(y<100)y+=2000;job.date=y+'-'+pad(+m[2])+'-'+pad(+m[1]);continue}
    if((m=line.match(/^(groom|bride)\s*:\s*(.*)$/i))){sec=m[1].toLowerCase();job[sec].name=m[2];continue}
    if((m=line.match(/^(ceremony|photos|getaway)\s*:?\s*(.*)$/i))&&!/^(ceremony|photos|getaway)\s+\w+\s*:/i.test(line)){sec=m[1].toLowerCase();if(m[2])job[sec][sec==='getaway'?'car':'location']=m[2];continue}
    if((m=line.match(/^reception\s*:?\s*(.*)$/i))){sec='reception';job.reception.venue=m[1];continue}
    if((m=line.match(/^note\s*:\s*(.*)$/i))){job.note=(job.note?job.note+' ':'')+m[1];continue}
    if(sec&&(m=line.match(/^([a-z ]+?)\s*:\s*(.*)$/i))){
      const k=m[1].toLowerCase(),v=m[2].trim(),o=job[sec];
      if(/time/.test(k)){const p=parseTime(v,sec[0].toUpperCase()+sec.slice(1),warns);o.time=p.text;o.t24=p.t24}
      else if(/address/.test(k))o.address=v; else if(/location|venue/.test(k))o.location=v;
      else if(/cars?/.test(k))o.cars=v; else if(/destination/.test(k))o.destination=v; else o[k]=v;
      continue;
    }
    if(/^g class run sheet$/i.test(line))continue;
    job.note=(job.note?job.note+' ':'')+line;
  }
  if(!job.client&&(job.bride.name||job.groom.name)) job.client=[job.bride.name,job.groom.name].filter(Boolean).join(' & ');
  const start=[job.groom.t24,job.bride.t24].filter(Boolean).sort()[0]||'';
  // Give each line a start time, then pick an actual car: same model, not already used in this job, free at that time.
  const busy=job.date?busyLines(job.date,job.id):[];
  raws.forEach(r=>{
    const l={...r,carId:'',wid:matchWorker(r.driverText)};
    const getawayOnly=/getaway/i.test(r.task)&&!r.hours;
    if(getawayOnly&&job.getaway.t24){const g=toMin(job.getaway.t24)-30;l.start=pad(Math.floor(g/60))+':'+pad(g%60);l.hours=null}
    else l.start=start;
    const win=getawayOnly?(l.start?[toMin(l.start),toMin(l.start)+60]:null):lineWindow(job,l);
    const cands=carCandidates(r.carText);
    const sameCarSameDriver=job.lines.find(x=>x.wid&&x.wid===l.wid&&cands.includes(x.carId));
    const used=job.lines.map(x=>x.carId);
    l.carId=(sameCarSameDriver&&sameCarSameDriver.carId)||cands.find(id=>!used.includes(id)&&!busy.some(b=>b.l.carId===id&&overlaps(b.win,win)))||cands.find(id=>!used.includes(id))||cands[0]||'';
    if(!l.carId) warns.push(`I don't recognise the car "${r.carText}". Pick it below.`);
    if(!l.wid) warns.push(`I don't recognise the driver "${r.driverText||'(none)'}". Pick them below.`);
    job.lines.push(l);
  });
  // each car starts at its own pickup (bride cars at the bride's time, groom cars at the groom's)
  job.lines.forEach(l=>{if(/getaway/i.test(l.task)&&!l.hours)return;const p=pickupFor(job,l);if(p&&p[1].t24)l.start=p[1].t24});
  if(!job.date) warns.push('No date found. Add a line like "Date : 29/11/26".');
  if(!job.client) warns.push('No client name found.');
  if(!job.lines.length) warns.push('No cars found. Car lines look like "1x RR Ghost @2 Hours - Adem".');
  return {job,warns};
}
function lineWin(job,l){if(/getaway/i.test(l.task)&&!l.hours){const s=toMin(l.start);return s==null?null:[s,s+60]}return lineWindow(job,l)}
function jobWarnings(job){
  const w=[];const busy=busyLines(job.date,job.id);
  job.lines.forEach(l=>{
    const win=lineWin(job,l);
    if(l.wid&&S.avail[l.wid+'|'+job.date]==='no') w.push(`${W(l.wid).name} marked ${fmtDay(job.date)} as Off.`);
    const cc=busy.find(b=>l.carId&&b.l.carId===l.carId&&overlaps(b.win,win));
    if(cc) w.push(`${C(l.carId).name} is also on ${cc.j.client}'s job from ${h12(cc.l.start)}.`);
    const dc=busy.find(b=>l.wid&&b.l.wid===l.wid&&overlaps(b.win,win));
    if(dc) w.push(`${W(l.wid).name} is also driving for ${dc.j.client} from ${h12(dc.l.start)}.`);
  });
  const seen={};job.lines.forEach(l=>{if(l.wid){if(seen[l.wid]&&seen[l.wid]!==l.carId)w.push(`${W(l.wid).name} is on two different cars in this job.`);seen[l.wid]=l.carId}});

}

  j.lines.forEach(l=>L.push(`1x ${C(l.carId).name||l.carText}${l.hours?` @${l.hours} Hours`:''}${l.task?` · (${l.task})`:''} - ${l.wid?W(l.wid).name:l.driverText}${l.note?` (${l.note})`:''}`));

  return L.join('\n');
}

const MODELS=[/ghost/i,/ghost/i,/cullinan/i,/cullinan/i,/phantom/i,/maybach/i,/g63/i,/g63/i,/urus/i,/chrysler/i,/chrysler/i,/dawn/i,/revuelto/i,/v-class/i,/hummer/i,/austin|220se/i,/eleanor|charger/i,/ferrari|mclaren|aventador/i];

function seed(){
  const workers=[{id:'w0',name:'Ahmed K',pin:'0000',role:'owner'},
    ...REAL_DRIVERS.map((n,i)=>({id:'w'+(i+1),name:n,pin:String(1111*(i+1)).slice(-4).padStart(4,'0'),role:'driver'})),
    ...SAMPLE_DRIVERS.map((n,i)=>({id:'s'+i,name:n,pin:'9999',role:'driver',sample:true}))];
  // first four keep the PINs from the earlier demo
  ['1111','2222','3333','4444','5555','6666','7777','8888','9090'].forEach((p,i)=>workers[i+1].pin=p);
  const cars=[...REAL_CARS.map(([n,c],i)=>({id:'c'+i,name:n,code:c,rego:'Rego TBC'})),...SAMPLE_CARS.map(([n,c],i)=>({id:'x'+i,name:n,code:c,rego:'Rego TBC',sample:true}))];
  S={workers,cars,avail:{},jobs:[],trips:[],notes:[],chats:{},seen:{}};
  // Availability for the next 14 days: sample drivers mostly free on weekends.
  const r=rng(7);const t0=today();
  workers.filter(w=>w.sample).forEach(w=>{for(let i=0;i<14;i++){const d=addDays(t0,i),wk=d.getDay()===0||d.getDay()===6;const x=r();
    if(x<(wk?.82:.45))S.avail[w.id+'|'+iso(d)]='yes';else if(x<(wk?.9:.75))S.avail[w.id+'|'+iso(d)]='no'}});
  // The two real run sheets (Sunday 29 Nov)
  [SAMPLE,SAMPLE2].forEach(txt=>{const {job}=parseRunSheet(txt);S.jobs.push(job);job.lines.forEach(l=>{if(l.wid)S.avail[l.wid+'|'+job.date]='yes'});notify(job,'new')});
  // Example jobs to make Sat 28 and Sun 29 look like a real weekend (about 10 a day)
  // Dummy jobs for the next 4 weeks: about 10 a day on weekends, a few on weekdays.
  const rr=rng(42);
  for(let i=0;i<28;i++){const d=addDays(t0,i),date=iso(d),dow=d.getDay();
    const real=S.jobs.filter(j=>j.date===date).length;
    const target=dow===6||dow===0?9+Math.floor(rr()*3):dow===5?1+Math.floor(rr()*3):Math.floor(rr()*3);
    for(let k=0;k<Math.max(0,target-real);k++) S.jobs.push(exampleJob(date,k,rng(1000+i*31+k)));}
  return S;
}
function exampleJob(date,k,r){
  const formal=r()<.18;
  const startH=formal?17+Math.floor(r()*2):9+Math.floor(r()*7);const startM=pick(r,['00','15','30','45']);
  const start=pad(startH)+':'+startM;const sMin=toMin(start);
  const fmt=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
  const bride=pick(r,BRIDES),groom=pick(r,GROOMS);
  const nCars=formal?1:1+Math.floor(r()*3)+(r()<.3?1:0);
  const job={id:uid(),example:true,date,client:formal?`${bride} (Year 12 formal)`:`${bride} & ${groom}`,groom:{},bride:{},ceremony:{},photos:{},reception:{},getaway:{},note:'',lines:[]};
  const addr=()=>`${1+Math.floor(r()*120)} ${pick(r,STREETS)}, ${pick(r,SUBURBS)}`;
  job.bride={name:bride,address:addr(),time:h12(start),t24:start};
  if(!formal){const gt=fmt(sMin-30);job.groom={name:groom,address:addr(),time:h12(gt),t24:gt};
    const ch=pick(r,CHURCHES);const ct=fmt(sMin+75);job.ceremony={location:ch[0],address:ch[1],time:h12(ct),t24:ct};
    job.photos={location:pick(r,PHOTOS),time:'straight after church'};const rt=fmt(sMin+330);job.reception={venue:pick(r,RECEPTIONS),time:h12(rt),t24:rt};
    if(r()<.4){const g=fmt(sMin+690);job.getaway={time:h12(g)+' arrive',t24:g,destination:pick(r,['The Crown Sydney','Shangri-La Sydney','Park Hyatt','InterContinental Double Bay','The Star Grand'])}}}
  else {job.reception={venue:pick(r,RECEPTIONS),time:h12(fmt(sMin+60)),t24:fmt(sMin+60)}}
  const busy=busyLines(date,job.id);const used=[];const usedW=[];
  const freeCar=(model,win)=>S.cars.filter(c=>model.test(c.name)&&!used.includes(c.id)&&!busy.some(b=>b.l.carId===c.id&&overlaps(b.win,win)));
  const freeDriver=win=>{const ws=S.workers.filter(w=>w.role!=='owner'&&!usedW.includes(w.id)&&S.avail[w.id+'|'+date]!=='no'&&!busy.some(b=>b.l.wid===w.id&&overlaps(b.win,win)));
    const pref=ws.filter(w=>S.avail[w.id+'|'+date]==='yes');return (pref.length?pick(r,pref):ws.length?pick(r,ws):null)};
  const groomCars=[],brideCars=[];
  for(let i=0;i<nCars;i++){
    const hours=formal?3:pick(r,[2,3,5,6,6]);const st=(!formal&&i%2===1)?job.groom.t24:start;const win=[toMin(st),toMin(st)+hours*60];
    let car=null;for(let tries=0;tries<12&&!car;tries++){car=freeCar(pick(r,MODELS),win)[0]||null}
    if(!car)continue;const w=freeDriver(win);used.push(car.id);if(w)usedW.push(w.id);
    const line={carText:car.name,carId:car.id,wid:w?w.id:'',driverText:w?w.name:'',hours,task:formal?'Formal':(hours<=3?((i%2)?'Groom to church':'Bride to church'):''),note:'',start:st};
    job.lines.push(line);(i%2&&!formal?groomCars:brideCars).push(car.name.replace(/ (\d+|I+|VIII|\(.*\))$/,''));
    busy.push({l:line,j:job,win});
  }
  job.bride.cars=brideCars.join(' & ');if(!formal)job.groom.cars=groomCars.join(' & ');
  job.lines.forEach(l=>{if(l.wid&&!S.avail[l.wid+'|'+date])S.avail[l.wid+'|'+date]='yes'});
  return job;
}

// "1x Ghost (Adem)" in a Cars: line means the Ghost that Adem drives.
function carTokenMatch(tok,l){const c=C(l.carId);if(!l.carId)return false;
  let T=tok.trim().replace(/^\d+\s*x\s*/i,'');const par=(T.match(/\(([^)]*)\)/)||[])[1]||'';T=T.replace(/\(.*\)/,'').trim().toLowerCase();if(!T)return false;
  if(par){const who=W(l.wid).name.toLowerCase().split(' ')[0];const named=S.workers.some(w=>par.toLowerCase().includes(w.name.toLowerCase().split(' ')[0])&&w.name.length>2);
    if(named&&!par.toLowerCase().includes(who))return false}
  if(T==='rr'||T==='rolls')return /^rr\b|rolls/i.test(c.name);
  if(T==='g'||T==='g wagon'||T==='gwagon')return /g\s*-?\s*wagon/i.test(c.name);
  return T.length>2&&(carCandidates(T).includes(l.carId)||c.name.toLowerCase().includes(T))}
function pickupFor(job,l){const t=(l.task||'').toLowerCase();
  if(/groom/.test(t))return ['Groom',job.groom]; if(/bride/.test(t))return ['Bride',job.bride];
  for(const k of ['bride','groom']){const toks=(job[k].cars||'').split(/&|,|\+|\band\b/i);if(toks.some(x=>carTokenMatch(x,l)))return [k==='groom'?'Groom':'Bride',job[k]]}
  if(/getaway/.test(t)&&job.getaway.destination)return ['Getaway',{time:job.getaway.time,address:'Reception: '+(job.reception.venue||'')+' → '+job.getaway.destination}];
  return null}
function members(job){return [...new Set([...S.workers.filter(w=>w.role==='owner').map(w=>w.id),...job.lines.map(l=>l.wid).filter(Boolean)])]}
function notify(job,kind){
  const owner=S.workers.find(w=>w.role==='owner');const told=[];
  job.lines.forEach(l=>{if(!l.wid)return;const p=pickupFor(job,l);
    const txt=`${kind==='new'?'New job':'Job updated'} · ${fmtDay(job.date)} · ${C(l.carId).name||l.carText}${l.hours?' ('+l.hours+' hrs)':''}. `+(p?`${p[0]} pickup ${p[1].time||'time TBC'} at ${p[1].address||'address TBC'}.`:`Start ${h12(l.start)||'time TBC'}.`)+(l.note?' '+l.note:'');
    S.notes.push({id:uid(),wid:l.wid,jobId:job.id,text:txt,at:Date.now(),read:false});told.push(W(l.wid).name)});
  (S.chats[job.id]=S.chats[job.id]||[]).push({sys:true,at:Date.now(),text:`${owner?owner.name:'Owner'} ${kind==='new'?'created':'updated'} the run sheet and notified ${told.join(', ')||'nobody yet'}.`});
  return told;
}
const chatUnread=(jobId,wid)=>{const m=S.chats[jobId]||[];return m.slice(S.seen[wid+'|'+jobId]||0).filter(x=>!x.sys&&x.wid!==wid).length};

function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const m=520,s=Math.min(1,m/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=img.width*s;cv.height=img.height*s;cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',.6))};img.onerror=()=>res(null);img.src=r.result};r.readAsDataURL(file)})}
function confirmTrip(){
  const d=draft,now=Date.now();
  if(d.mode==='out'){
    const job=myShifts().find(s=>s.date===iso(today())&&s.carId===d.carId);

  <div class="ownergrid">
  <div class="card"><div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="cal-h">${d}</div>`).join('')}${cells}</div>
    <div class="legend"><span>Number = jobs that day</span><span><i style="background:var(--warn)"></i>Something to check</span></div></div>
  <div class="card"><div class="row"><span class="eyebrow">${fmtDay(calDay)}</span><div class="spacer"></div><span class="muted" style="font-size:.8rem">${pl(dayJobs.length,'job')} · ${pl(dayJobs.reduce((n,j)=>n+j.lines.length,0),'car')}</span></div>
    <div id="caljobs">${dayJobs.map(jobRow).join('')||'<p class="muted" style="margin:0">No jobs this day.</p>'}</div>
    <button class="btn block" data-act="newjob">+ New job</button></div>
  </div>`;
}

/* ---------- Owner: Fleet ---------- */
let fleetFilter='all';
function fleetView(){
  const t=iso(today());const next2=[t,iso(addDays(today(),1)),iso(addDays(today(),2))];
  const rows=S.cars.map(c=>{const o=openTrip(c.id);const nx=shifts().filter(s=>s.carId===c.id&&s.date>=t).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));return {c,o,nx}});
  const counts={all:rows.length,out:rows.filter(r=>r.o).length,booked:rows.filter(r=>r.nx.some(s=>next2.includes(s.date))).length,free:rows.filter(r=>!r.o&&!r.nx.some(s=>next2.includes(s.date))).length};
  const vis=rows.filter(r=>fleetFilter==='all'||(fleetFilter==='out'&&r.o)||(fleetFilter==='booked'&&r.nx.some(s=>next2.includes(s.date)))||(fleetFilter==='free'&&!r.o&&!r.nx.some(s=>next2.includes(s.date))));
  return `<div><span class="eyebrow">Fleet · ${S.cars.length} cars</span><h2>Cars</h2></div>
  <div class="card">
   <div class="seg">${[['all','All'],['out','Out now'],['booked','Booked next 3 days'],['free','Free']].map(([k,l])=>`<button data-fleet="${k}" aria-pressed="${fleetFilter===k}">${l} <span>${counts[k]}</span></button>`).join('')}</div>
   <input type="search" class="search" placeholder="Search cars" data-filter="#fleetlist" aria-label="Search cars">
   <div class="list" id="fleetlist">${vis.map(({c,o,nx})=>`<div class="li" data-q="${esc((c.name+' '+c.rego).toLowerCase())}">${sw(c.id)}<div class="body"><b>${esc(c.name)}</b>${c.sample?' <span class="pill n">Sample</span>':''}
     <div class="muted" style="font-size:.84rem">${o?`Out with <b style="color:var(--fg)">${esc(W(o.wid).name)}</b> since ${fmtTime(o.outAt)}`:nx[0]?`Next: ${fmtDay(nx[0].date)} ${h12(nx[0].start)} · ${esc(nx[0].job.client)} · ${esc(nx[0].wid?W(nx[0].wid).name:'no driver')}${nx.length>1?` · +${nx.length-1} more`:''}`:'Nothing booked'}</div></div>
     ${o?'<span class="pill no">Out</span>':'<span class="pill ok">In</span>'}</div>`).join('')||'<p class="muted" style="margin:0">No cars match.</p>'}</div>
  </div>
  <form class="card" id="carform"><span class="eyebrow">Add a car</span><div class="grid2"><label class="f">Name<input id="cname" type="text" required placeholder="e.g. Bentley Mulsanne"></label><label class="f">Rego<input id="crego" type="text" required></label></div><button class="btn" type="submit">Add car</button></form>`;
}

/* ---------- Owner: Log ---------- */
function tripRow(t){
  const ph=[...(t.outPhotos||[]),...(t.inPhotos||[])];
  return `<div class="li">${sw(t.carId)}<div class="body">
   <div class="row" style="gap:6px"><b>${esc(C(t.carId).name)}</b><span class="muted">· ${esc(W(t.wid).name)} · ${fmtDay(t.date)}</span>${t.inAt?'':'<span class="pill no">Still out</span>'}</div>
   ${t.jobId&&J(t.jobId)?`<div class="muted" style="font-size:.85rem">${esc(J(t.jobId).client)}'s wedding</div>`:''}
   <div class="mono muted">${fmtTime(t.outAt)} out · ${t.outOdo} km · ${esc(t.outFuel)}${t.inAt?` → ${fmtTime(t.inAt)} in · ${t.inOdo} km · ${esc(t.inFuel)} · <b style="color:var(--fg)">${t.inOdo-t.outOdo} km</b>`:''}</div>
   ${t.outNotes?`<div style="font-size:.88rem">Out: ${esc(t.outNotes)}</div>`:''}${t.inNotes?`<div style="font-size:.88rem">In: ${esc(t.inNotes)}</div>`:''}
   ${ph.length?`<div class="photos" style="margin-top:6px">${ph.map(p=>`<img src="${p}" alt="">`).join('')}</div>`:''}</div></div>`;
}
function logView(){
  const ts=S.trips.slice().sort((a,b)=>b.outAt-a.outAt);
  const n=ts.reduce((a,t)=>a+(t.outPhotos?.length||0)+(t.inPhotos?.length||0),0);
  return `<div><span class="eyebrow">Every sign-out and return</span><h2>Photos &amp; log</h2><p class="muted" style="margin:4px 0 0">${ts.length} trips · ${n} photos. Replaces the WhatsApp photo thread.</p></div>
  <div class="card">${ts.map(tripRow).join('')||'<p class="muted" style="margin:0">Nothing yet. When a driver signs a car out on the day, their photos and odometer show up here.</p>'}</div>`;
}

/* ---------- Owner: Staff ---------- */
function staffView(){
  return `<div><span class="eyebrow">Team</span><h2>Staff</h2></div>
  <div class="card"><input type="search" class="search" placeholder="Search ${S.workers.length} staff" data-filter="#stafflist" aria-label="Search staff"><div class="list" id="stafflist">${S.workers.map(w=>`<div class="li" data-q="${esc(w.name.toLowerCase())}"><div class="avatar">${esc(initials(w.name))}</div><div class="body"><b>${esc(w.name)}</b><div class="muted" style="font-size:.85rem">${w.role==='owner'?'Owner':w.sample?'Sample driver':'Chauffeur'} · PIN <span class="mono">${esc(w.pin)}</span></div></div></div>`).join('')}</div></div>
  <form class="card" id="staffform"><span class="eyebrow">Add a chauffeur</span><div class="grid2"><label class="f">Name<input id="wname" type="text" required></label><label class="f">4-digit PIN<input id="wpin" type="text" inputmode="numeric" pattern="\\d{4}" maxlength="4" required></label></div><button class="btn" type="submit">Add chauffeur</button></form>
  <div class="card"><span class="eyebrow">Demo data</span><p class="muted" style="margin:0">Puts back the sample weekend (your two real run sheets plus example jobs) and clears everything else.</p><button class="btn" data-act="reset">Reset demo data</button></div>`;
}

/* ---------- Binding ---------- */
function bind(){
  const $=s=>document.getElementById(s);
  $('logout').onclick=()=>{me=null;sheet=null;render()};
  $('bell').onclick=()=>{sheet='inbox';render()};
  document.querySelectorAll('[data-rday]').forEach(b=>b.onclick=()=>{rosterDay=b.dataset.rday;jobsDay=b.dataset.rday;render()});
  document.querySelectorAll('[data-jday]').forEach(b=>b.onclick=()=>{jobsDay=b.dataset.jday||null;if(jobsDay)rosterDay=jobsDay;render()});
  document.querySelectorAll('[data-fleet]').forEach(b=>b.onclick=()=>{fleetFilter=b.dataset.fleet;render()});
  document.querySelectorAll('[data-cday]').forEach(b=>b.onclick=()=>{calDay=b.dataset.cday;render()});
  document.querySelectorAll('[data-cal]').forEach(b=>b.onclick=()=>{calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+(+b.dataset.cal),1);render()});
  bindFilters();
  document.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>{chatJob=b.dataset.chat;S.seen[me.id+'|'+chatJob]=(S.chats[chatJob]||[]).length;S.notes.forEach(n=>{if(n.wid===me.id&&n.jobId===chatJob)n.read=true});save();sheet='chat';render()});
  document.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>{const n=S.notes.find(x=>x.id===b.dataset.note);n.read=true;save();viewJob=n.jobId;sheet=J(n.jobId)?'job':null;render()});
  if(sheet==='chat'){const log=$('chatlog');if(log)log.scrollTop=log.scrollHeight;
    $('chatform').onsubmit=e=>{e.preventDefault();const v=$('chatin').value.trim();if(v)sendChat(v);setTimeout(()=>document.getElementById('chatin')?.focus(),0)};
    $('chatph').onchange=async e=>{const f=e.target.files[0];if(f){const u=await shrink(f);if(u)sendChat('',u)}}}
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();scrollTo(0,0)});
  document.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>{viewJob=b.dataset.job;delArm=null;S.notes.forEach(n=>{if(n.wid===me.id&&n.jobId===viewJob)n.read=true});save();sheet='job';render()});
  document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{const k=me.id+'|'+b.dataset.day;if(myShifts().some(s=>s.date===b.dataset.day))return toast('You\'re booked that day. Message Ahmed to swap.');
    const v=S.avail[k];if(!v)S.avail[k]='yes';else if(v==='yes')S.avail[k]='no';else delete S.avail[k];save();render()});
  document.querySelectorAll('[data-cell]').forEach(b=>b.onclick=()=>{const [wid,date]=b.dataset.cell.split('|');const v=S.avail[wid+'|'+date];toast(`${W(wid).name}: ${v==='yes'?'free':v==='no'?'off':'hasn\'t marked'} ${fmtDay(date)}`)});
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{const a=b.dataset.act;
    if(a==='pickcar')startDraft('out',b.dataset.car);
    if(a==='signin')startDraft('in');
    if(a==='close'){sheet=null;draft=null;paste=null;render()}
    if(a==='confirm')confirmTrip();
    if(a==='newjob'){paste={text:TEMPLATE,parsed:null};sheet='paste';render()}
    if(a==='editjob'){const j=J(viewJob);paste={text:runSheetText(j),editId:j.id,parsed:null};sheet='paste';render()}
    if(a==='parse'){paste.text=$('pastein').value;paste.parsed=parseRunSheet(paste.text);if(paste.editId)paste.parsed.job.id=paste.editId;render();setTimeout(()=>document.querySelector('[data-act="savejob"]')?.scrollIntoView({block:'nearest'}),0)}
    if(a==='savejob')saveJob();
    if(a==='deljob'){if(delArm===viewJob){S.jobs=S.jobs.filter(j=>j.id!==viewJob);save();sheet=null;delArm=null;render();toast('Job deleted')}else{delArm=viewJob;render()}}
    if(a==='copyrs'){const txt=runSheetText(J(viewJob));try{await navigator.clipboard.writeText(txt);toast('Copied. Paste it into WhatsApp.')}catch(e){toast('Copy blocked here. Open Edit and copy the text.')}}
    if(a==='allfree'){for(let i=0;i<14;i++){const k=me.id+'|'+iso(addDays(today(),i));if(!S.avail[k])S.avail[k]='yes'}save();render();toast('Marked as Free')}
    if(a==='reset'){S=seed();save();me=S.workers[0];render();toast('Demo data reset')}
  });
  if(sheet==='paste'&&paste.parsed){
    const L=paste.parsed.job.lines;
    document.querySelectorAll('[data-lc]').forEach(s=>s.onchange=()=>{L[+s.dataset.lc].carId=s.value;paste.text=$('pastein').value;refreshWarn()});
    document.querySelectorAll('[data-lw]').forEach(s=>s.onchange=()=>{L[+s.dataset.lw].wid=s.value;paste.text=$('pastein').value;refreshWarn()});
    document.querySelectorAll('[data-lh]').forEach(s=>s.oninput=()=>{L[+s.dataset.lh].hours=s.value?+s.value:null});
  }
  if(sheet==='trip'){
    $('odo').oninput=e=>{draft.odo=e.target.value;const btn=document.querySelector('[data-act="confirm"]');if(btn)btn.disabled=!(draft.odo&&draft.fuel&&draft.photos.length>=2)};
    $('notes').oninput=e=>draft.notes=e.target.value;
    document.querySelectorAll('[data-fuel]').forEach(b=>b.onclick=()=>{draft.fuel=b.dataset.fuel;render()});
    document.querySelectorAll('[data-chk]').forEach(c=>c.onchange=()=>{const x=c.dataset.chk;draft.checks=c.checked?[...draft.checks,x]:draft.checks.filter(y=>y!==x)});
    $('ph').onchange=async e=>{for(const f of e.target.files){const u=await shrink(f);if(u)draft.photos.push(u)}render()};
  }
  const cf=$('carform');if(cf)cf.onsubmit=e=>{e.preventDefault();const n=$('cname').value.trim();S.cars.push({id:uid(),name:n,code:initials(n),rego:$('crego').value.trim().toUpperCase()});save();render();toast('Car added')};
  const sf=$('staffform');if(sf)sf.onsubmit=e=>{e.preventDefault();S.workers.push({id:uid(),name:$('wname').value.trim(),pin:$('wpin').value,role:'driver'});save();render();toast('Chauffeur added')};
}
/* re-check warnings after fixing a car/driver pick, keeping the parser's own notes about unrecognised names only if still unresolved */
function refreshWarn(){const p=paste.parsed;p.warns=p.warns.filter(w=>{const m=w.match(/"(.+)"/);if(!m)return true;return p.job.lines.some(l=>(/car/.test(w)?!l.carId&&l.carText===m[1]:!l.wid&&l.driverText===m[1]))});
  const st=document.querySelector('.sheet .panel').scrollTop;render();document.querySelector('.sheet .panel').scrollTop=st}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.workers){S=seed();save()}
S.notes=S.notes||[];S.chats=S.chats||{};S.seen=S.seen||{};
render();
})();
</script>
</html>
